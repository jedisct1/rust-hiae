[package]
name = "hiae"
version = "0.1.3"
edition = "2021"
authors = ["Frank Denis"]
description = "HiAE authenticated encryption with associated data (AEAD) in Rust, with AES-NI, ARM NEON, and no_std support"
license = "MIT OR Apache-2.0"
repository = "https://github.com/hiae-aead/draft-pham-hiae"
keywords = ["aead", "encryption", "authentication", "aes", "no-std"]
categories = ["cryptography", "no-std"]
include = [
    "src/**",
    "benches/**",
    "examples/**",
    "README.md",
    "LICENSE*",
]

[features]
default = ["std"]
std = []

[dev-dependencies]
hex = "0.4"
criterion = { version = "0.7", features = ["html_reports"] }

[profile.release]
lto = true
codegen-units = 1
panic = "abort"

[profile.bench]
lto = true
codegen-units = 1

[[bench]]
name = "hiae_bench"
harness = false

